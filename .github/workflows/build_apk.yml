name: Build Android APK
on:
  push:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ubuntu-24.04  # एकदम नया और स्टेबल लिनक्स सर्वर
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0' # एकदम स्टेबल फ्लटर वर्जन जो तुरंत काम करेगा
          
      - name: Download App Packages
        run: flutter pub get
          
      - name: Build MS PDF PRO APK
        run: flutter build apk --debug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-PRO-v1.0
          path: build/app/outputs/flutter-apk/app-debug.apk
