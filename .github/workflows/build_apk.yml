name: Build Android APK
on:
  push:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ubuntu-latest  # यह हमेशा लेटेस्ट स्टेबल लिनक्स चुनेगा
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java (Latest v5)
        uses: actions/setup-java@v5 # यहाँ हमने नया v5 कर दिया है ताकि एरर न आए
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter (Latest v2)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build debug APK
        run: flutter build apk --debug
        
      - name: Upload APK (Latest v4)
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-PRO-v1.0
          path: build/app/outputs/flutter-apk/app-debug.apk
          
