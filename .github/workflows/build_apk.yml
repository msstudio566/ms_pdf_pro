name: Build Android APK
on:
  push:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
          
      - name: Setup Flutter Engine
        run: |
          git clone https://github.com -b stable --depth 1
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
          
      - name: Download App Packages
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter pub get
          
      - name: Build MS PDF PRO APK
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter build apk --debug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-PRO-v1.0
          path: build/app/outputs/flutter-apk/app-debug.apk
          
