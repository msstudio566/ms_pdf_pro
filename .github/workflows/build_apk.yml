name: Build Android APK
on:
  push:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ubuntu-22.04  # स्टेबल पुराना लिनक्स ताकि नोड का कोई लफड़ा न हो
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true' # पुराने नोड को चलने की इजाजत दें
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.6' # स्टेबल फ्लटर वर्जन ताकि कोई एरर न आए
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build debug APK
        run: flutter build apk --debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-PRO-v1.0
          path: build/app/outputs/flutter-apk/app-debug.apk
          
